services:
  web:
    build: .
    container_name: studentapp-web
    ports:
      - "8080:80"
    volumes:
      - ./student:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: studentapp-db
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"   # empty root password
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_DATABASE: studentrecorddb
    ports:
      - "3306:3306"
    volumes:
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d



